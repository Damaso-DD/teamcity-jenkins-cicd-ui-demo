# Pytest Configuration File
#
# This file configures how pytest runs tests in the CI/CD pipeline.
# It ensures consistent test execution across different environments.

[pytest]
# Directories to search for tests
testpaths = tests

# Pattern for test file discovery
python_files = test_*.py

# Pattern for test class discovery
python_classes = Test*

# Pattern for test function discovery
python_functions = test_*

# Minimum Python version required
minversion = 7.0

# Command line options applied by default
addopts = 
    # Verbose output - shows each test name
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks for debugging
    --showlocals
    # Generate coverage report
    --cov=src
    # Show missing lines in coverage report
    --cov-report=term-missing
    # Generate HTML coverage report
    --cov-report=html
    # Generate XML coverage report (for CI/CD tools)
    --cov-report=xml
    # Strict markers - fail if unknown marker is used
    --strict-markers

# Custom markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
